<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dreamlane BD - Admin Login. Sign in to manage your inventory, scan products, and track sales.">
    <title>Admin Login - Dreamlane BD</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo">
                <h1>Dreamlane BD</h1>
                <p>Admin Panel</p>
            </div>

            <form id="login-form" autocomplete="on">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="admin@dreamlane.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <div id="login-error" class="form-error" style="margin-bottom:16px;"></div>

                <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>
            </form>

            <div style="text-align:center;margin-top:20px;">
                <a href="/" style="color:var(--text-muted);font-size:0.85rem;">← Back to Shop</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
