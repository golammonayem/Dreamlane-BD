name: Keep Dreamlane BD Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository secret is not configured."
            exit 1
          fi

          HEALTH_URL="${APP_URL%/}/api/health"
          HTTP_STATUS=$(curl --silent --show-error --max-time 30 \
            --retry 2 --retry-delay 5 \
            --output /dev/null --write-out "%{http_code}" \
            "$HEALTH_URL" || echo "000")

          if [ "$HTTP_STATUS" = "429" ]; then
            echo "Health endpoint is rate-limited (429); treating as successful keep-alive ping."
            exit 0
          fi

          if [[ ! "$HTTP_STATUS" =~ ^2 ]]; then
            echo "Health check failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi