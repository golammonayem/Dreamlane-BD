version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: dreamlane-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dreamlane_bd
      MYSQL_USER: dreamlane_user
      MYSQL_PASSWORD: dreamlane_pass
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
